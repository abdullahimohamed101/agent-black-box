name: Pages

# INERT UNTIL THE OWNER ENABLES PAGES: this workflow runs only when started by hand (workflow_dispatch). It never runs on push or
# pull request. Publishing is a decision for the repository owner (Phase 20, G2): enable GitHub Pages (Settings > Pages > Source:
# GitHub Actions) and then start this workflow. The site is served under the project path (/<repository>/), no custom domain (D16).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # What to publish. The plain-HTML baseline is built by `node site/build.mjs` into site-dist/ (no sources). When the site moves to another stack,
  # change the Build step and this directory together; scripts/check-site.sh takes any built directory.
  SITE_DIR: site-dist

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: node site/build.mjs --out "$SITE_DIR"
      - name: Check the output
        run: scripts/check-site.sh "$SITE_DIR" --static
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
