name: Lockfile audit (weekly)

# New advisories appear without any change to this repository. This runs only the audit (not the whole CI) on a
# schedule, so a fresh advisory is noticed within a week; the same script runs on every pull request in ci.yml.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: scripts/audit-lockfiles.sh
