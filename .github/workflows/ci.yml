    # The performed restore drill (Phase 19b): seed a real installation (runs, events, artifacts of known bytes, an alert destination with a
    # sealed signing secret, a retention policy, quota overrides, sessions), back it up (module CLI, an encrypted bundle, and the compose `backup`
    # service built from the API image), DESTROY the source, restore into a fresh database and directory, then serve it: same runs, byte-identical
