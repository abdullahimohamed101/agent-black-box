name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb_dev_password
          POSTGRES_DB: abb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U abb -d abb" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      ABB_DATABASE_URL: postgresql+asyncpg://abb:abb_dev_password@localhost:5433/abb
      ABB_TEST_DATABASE_URL: postgresql+asyncpg://abb:abb_dev_password@localhost:5433/abb_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          (cd apps/api && uv sync --frozen)
          (cd packages/event-schema && uv sync --frozen)
          (cd packages/sdk-python && uv sync --frozen)
          pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=abb_dev_password psql -h localhost -p 5433 -U abb -d abb -c 'CREATE DATABASE abb_test'
      - name: Quality gate (full)
        run: scripts/quality.sh full
      - name: Dependency audit
        run: make audit

  sdk:
    # The SDK promises Python >= 3.10 and no dependencies: test the oldest and a current version.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          cd packages/sdk-python
          uv sync --frozen --python ${{ matrix.python }}
          uv run pytest -q

  integrations:
    # Framework adapters (ADR-050): own environment per package, fakes plus the real framework, no network needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [conformance, langgraph, openai, anthropic, mcp]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test ${{ matrix.package }}
        run: |
          cd integrations/${{ matrix.package }}
          uv sync --frozen --python ${{ matrix.python }}
          uv run ruff check . && uv run ruff format --check . && uv run mypy
          uv run pytest -q --cov

  integrations-e2e:
    # A LangGraph example through the real API (scripts/integrations-e2e.sh; own database and port).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb_dev_password
          POSTGRES_DB: abb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U abb -d abb" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the e2e compares against origin/main
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          (cd apps/api && uv sync --frozen)
          (cd integrations/langgraph && uv sync --frozen)
          cp .env.example .env
      - name: LangGraph example end to end
        run: scripts/integrations-e2e.sh

  stream-e2e:
    # Live streaming in a real browser: API + worker + built web server + Python SDK writer (scripts/stream-e2e.sh).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb_dev_password
          POSTGRES_DB: abb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U abb -d abb" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          (cd apps/api && uv sync --frozen)
          (cd packages/event-schema && uv sync --frozen)
          (cd packages/sdk-python && uv sync --frozen)
          pnpm install --frozen-lockfile
          cp .env.example .env
      - name: Build the web app
        run: pnpm --filter @abb/web build
      - name: Streaming end to end
        run: scripts/stream-e2e.sh
      - name: Keep Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-e2e-results
          path: apps/web/test-results
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose --profile app up -d --build --wait
      - name: Smoke (provision, ingest over gzip, worker derives, read back, negative cases)
        run: |
          curl -fsS localhost:3000/ >/dev/null
          scripts/smoke.sh
      - uses: astral-sh/setup-uv@v5
      - name: SDK end to end (real SDK -> real API -> read back)
        run: |
          (cd packages/sdk-python && uv sync --frozen)
          scripts/sdk-e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
