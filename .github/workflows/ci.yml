name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # A pull request that touches only documentation skips the heavy jobs below (they report "skipped", which counts as
    # passing). Anything else, including .github/, scripts, code, and every push to main, runs the full set.
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA" "$MERGE_SHA")
            echo "changed files:"; echo "$files"
            other=$(printf '%s\n' "$files" | grep -vcE '^(docs/|[A-Za-z_]+\.md$|LICENSE$)' || true)
            if [ -n "$files" ] && [ "$other" = "0" ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb_dev_password
          POSTGRES_DB: abb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U abb -d abb" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      ABB_DATABASE_URL: postgresql+asyncpg://abb:abb_dev_password@localhost:5433/abb
      ABB_TEST_DATABASE_URL: postgresql+asyncpg://abb:abb_dev_password@localhost:5433/abb_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          # The `otel` extra is installed here so tests/obs/test_tracing_otel.py RUNS in CI instead of skipping (KI-237). `uv run`
          # syncs without removing it. Local installs stay as they were (extras are opt-in).
          (cd apps/api && uv sync --frozen --extra otel)
          (cd packages/event-schema && uv sync --frozen)
          (cd packages/sdk-python && uv sync --frozen)
          pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=abb_dev_password psql -h localhost -p 5433 -U abb -d abb -c 'CREATE DATABASE abb_test'
      - name: Quality gate (full)
        run: scripts/quality.sh full
      - name: Dependency audit (JavaScript production dependencies; Python lockfiles run in lockfile-audit)
        run: make audit-pnpm

  pins:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # KI-024: every action pinned by commit sha, every image by digest (scripts/check_pins.py). Reads files only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-pins.sh

  docs:
    # Phase 20 (D14): relative links and anchors resolve, and the command blocks of the user-facing docs are real (marked
    # blocks are executed, the rest are reference-checked against the Makefile, compose file and CLI). Runs on every change,
    # including documentation-only ones, so it does not wait for the `changes` job. No network beyond `uv`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check_docs_links.py README.md docs site CONTRIBUTING.md
      - run: scripts/docs-commands-check.sh

  lockfile-audit:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # KI-060: pip-audit over every uv.lock (scripts/audit-lockfiles.sh). A new advisory can fail an unchanged tree; the same script
    # also runs weekly in .github/workflows/lockfile-audit.yml so that happens on a schedule, not on someone's pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: scripts/audit-lockfiles.sh

  sdk:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # The SDK promises Python >= 3.10 and no dependencies: test the oldest and a current version.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          cd packages/sdk-python
          uv sync --frozen --python ${{ matrix.python }}
          uv run pytest -q

  integrations:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Framework adapters (ADR-050): own environment per package, fakes plus the real framework, no network needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [conformance, langgraph, openai, anthropic, mcp]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test ${{ matrix.package }}
        run: |
          cd integrations/${{ matrix.package }}
          uv sync --frozen --python ${{ matrix.python }}
          uv run ruff check . && uv run ruff format --check . && uv run mypy
          uv run pytest -q --cov

  integrations-e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # A LangGraph example through the real API (scripts/integrations-e2e.sh; own database and port).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb_dev_password
          POSTGRES_DB: abb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U abb -d abb" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the e2e compares against origin/main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: |
          (cd apps/api && uv sync --frozen)
          (cd integrations/langgraph && uv sync --frozen)
          cp .env.example .env
      - name: LangGraph example end to end
        run: scripts/integrations-e2e.sh

