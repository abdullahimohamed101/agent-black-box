name: Bug report
description: Something is wrong, or the product shows something the agent did not do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, API keys or real prompts. For security issues use the private
        report link on the issue chooser (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or clicks, as short as you can make them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [SDK, Integration adapter, API, Web app, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python, Node, and whether you run natively or in Docker.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Redact anything sensitive.
      render: shell
