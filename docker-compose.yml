# Local development stack. `make db` starts only Postgres; `docker compose --profile app up` adds api + web.
name: agent-black-box

x-api-env: &api-env
    # Development only. ABB_ENVIRONMENT=production is mandatory for any reachable deployment (docs/runbooks/auth-and-access.md):
    # it is what switches off http issuers, dev sessions and the seeded owner.
    ABB_ENVIRONMENT: development
    # The API and worker connect as the least-privilege role (KI-020): it can append to `events` but
    # never update or delete. Only the one-shot `migrate` job below uses the owner.
    ABB_DATABASE_URL: postgresql+asyncpg://abb_runtime:${ABB_RUNTIME_DB_PASSWORD:-abb_runtime_dev_password}@postgres:5432/abb
    ABB_CORS_ORIGINS: http://localhost:3000
    ABB_ARTIFACT_DIR: /data/artifacts
    # Overridable so load tests can measure capacity without the per-project limiter in the way.
    ABB_RATE_LIMIT_EVENTS_PER_SECOND: ${ABB_RATE_LIMIT_EVENTS_PER_SECOND:-2000}
    ABB_RATE_LIMIT_BURST_EVENTS: ${ABB_RATE_LIMIT_BURST_EVENTS:-10000}
    ABB_SUMMARY_DEBOUNCE_SECONDS: ${ABB_SUMMARY_DEBOUNCE_SECONDS:-1}

x-api: &api
  image: agent-black-box-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: *api-env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abb
      POSTGRES_PASSWORD: ${ABB_POSTGRES_PASSWORD:-abb_dev_password}
      POSTGRES_DB: abb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abb -d abb"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One image serves the api, the worker and the one-shot migration job.
  migrate:
    <<: *api
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      ABB_DATABASE_URL: postgresql+asyncpg://abb:${ABB_POSTGRES_PASSWORD:-abb_dev_password}@postgres:5432/abb
      ABB_RUNTIME_DB_PASSWORD: ${ABB_RUNTIME_DB_PASSWORD:-abb_runtime_dev_password}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    profiles: ["app"]
    environment:
      <<: *api-env
      # Sign-in for people (ADR-060). The issuer is the dev-only fake provider below; point these three at a real
      # OpenID Connect provider (and drop the fake-oidc service) for anything but a local demo.
      ABB_WEB_ORIGIN: http://localhost:3000
      ABB_OIDC_ISSUER: ${ABB_OIDC_ISSUER:-http://localhost:8900}
      ABB_OIDC_CLIENT_ID: ${ABB_OIDC_CLIENT_ID:-abb-dev}
      ABB_OIDC_CLIENT_SECRET: ${ABB_OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8900:8900" # the fake provider shares this container's network namespace (see fake-oidc)
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # DEVELOPMENT ONLY: a fake OpenID Connect provider that accepts any email and signs tokens with a throwaway key.
  # It shares the API container's network so `http://localhost:8900` is the same issuer URL for the browser and the API.
  # Never run it anywhere reachable: remove this service and set ABB_OIDC_* for a real provider.
  fake-oidc:
    <<: *api
    profiles: ["app"]
    network_mode: "service:api"
    working_dir: /repo/apps/api
    volumes:
      - ./apps/api/tests/fake_oidc.py:/repo/apps/api/fake_oidc.py:ro
    command:
      - python
      - fake_oidc.py
      - --host=0.0.0.0
      - --port=8900
      - --client-id=${ABB_OIDC_CLIENT_ID:-abb-dev}
      - --redirect-uri=http://localhost:3000/api/auth/callback
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  worker:
    <<: *api
    profiles: ["app"]
    command: ["python", "-m", "abb_api.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      # Server-side only. The web server holds no credential: it forwards the visitor's session cookie (ADR-060).
      ABB_API_INTERNAL_URL: http://api:8000
      ABB_WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  artifacts:
