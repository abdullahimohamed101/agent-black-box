# Local development stack. `make db` starts only Postgres; `docker compose --profile app up` adds api + web.
name: agent-black-box

x-api-env: &api-env
    # Development only. ABB_ENVIRONMENT=production is mandatory for any reachable deployment (docs/runbooks/auth-and-access.md):
    # it is what switches off http issuers, dev sessions and the seeded owner.
    ABB_ENVIRONMENT: development
    # The API and worker connect as the least-privilege role (KI-020): it can append to `events` but
    # never update or delete. Only the one-shot `migrate` job below uses the owner.
    ABB_DATABASE_URL: postgresql+asyncpg://abb_runtime:${ABB_RUNTIME_DB_PASSWORD:-abb_runtime_dev_password}@postgres:5432/abb
    ABB_CORS_ORIGINS: http://localhost:3000
    ABB_ARTIFACT_DIR: /data/artifacts
    # Overridable so load tests can measure capacity without the per-project limiter in the way.
    ABB_RATE_LIMIT_EVENTS_PER_SECOND: ${ABB_RATE_LIMIT_EVENTS_PER_SECOND:-2000}
    ABB_RATE_LIMIT_BURST_EVENTS: ${ABB_RATE_LIMIT_BURST_EVENTS:-10000}
    ABB_SUMMARY_DEBOUNCE_SECONDS: ${ABB_SUMMARY_DEBOUNCE_SECONDS:-1}

x-api: &api
  image: agent-black-box-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: *api-env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abb
      POSTGRES_PASSWORD: ${ABB_POSTGRES_PASSWORD:-abb_dev_password}
      POSTGRES_DB: abb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abb -d abb"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One image serves the api, the worker and the one-shot migration job.
  migrate:
    <<: *api
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      ABB_DATABASE_URL: postgresql+asyncpg://abb:${ABB_POSTGRES_PASSWORD:-abb_dev_password}@postgres:5432/abb
      ABB_RUNTIME_DB_PASSWORD: ${ABB_RUNTIME_DB_PASSWORD:-abb_runtime_dev_password}
      # Gives the retention role (ADR-159) a login; only the retention service below knows the password.
      ABB_RETENTION_DB_PASSWORD: ${ABB_RETENTION_DB_PASSWORD:-abb_retention_dev_password}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    profiles: ["app"]
    environment:
      <<: *api-env
      # Sign-in for people (ADR-060). The issuer is the dev-only fake provider below; point these three at a real
      # OpenID Connect provider (and drop the fake-oidc service) for anything but a local demo.
      ABB_WEB_ORIGIN: http://localhost:3000
      ABB_OIDC_ISSUER: ${ABB_OIDC_ISSUER:-http://localhost:8900}
      ABB_OIDC_CLIENT_ID: ${ABB_OIDC_CLIENT_ID:-abb-dev}
      ABB_OIDC_CLIENT_SECRET: ${ABB_OIDC_CLIENT_SECRET:-}
      # /metrics exists only when a token (24+ characters) is set (ADR-165). Blank: no endpoint.
      ABB_METRICS_TOKEN: ${ABB_METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8900:8900" # the fake provider shares this container's network namespace (see fake-oidc)
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # DEVELOPMENT ONLY: a fake OpenID Connect provider that accepts any email and signs tokens with a throwaway key.
  # It shares the API container's network so `http://localhost:8900` is the same issuer URL for the browser and the API.
  # Never run it anywhere reachable: remove this service and set ABB_OIDC_* for a real provider.
  fake-oidc:
    <<: *api
    profiles: ["app"]
    network_mode: "service:api"
    working_dir: /repo/apps/api
    volumes:
      - ./apps/api/tests/fake_oidc.py:/repo/apps/api/fake_oidc.py:ro
    command:
      - python
      - fake_oidc.py
      - --host=0.0.0.0
      - --port=8900
      - --client-id=${ABB_OIDC_CLIENT_ID:-abb-dev}
      - --redirect-uri=http://localhost:3000/api/auth/callback
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  worker:
    <<: *api
    profiles: ["app"]
    command: ["python", "-m", "abb_api.worker"]
    environment:
      <<: *api-env
      # The worker serves metrics only when a port is set (needs the token too); no port is published
      # on purpose. Inside the compose network a scraper container needs ABB_WORKER_METRICS_BIND=0.0.0.0.
      ABB_METRICS_TOKEN: ${ABB_METRICS_TOKEN:-}
      ABB_WORKER_METRICS_PORT: ${ABB_WORKER_METRICS_PORT:-}
      ABB_WORKER_METRICS_BIND: ${ABB_WORKER_METRICS_BIND:-127.0.0.1}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Data retention (ADR-159). Its own environment on purpose: the retention role's URL is never given to the
  # api or the worker, and this service has no ABB_DATABASE_URL. ABB_RETENTION_MODE=dry_run (the default)
  # only measures and writes reports. ABB_RETENTION_MODE=enforce deletes, permanently (ADR-160): back up first.
  # Enforcement removes artifact files through the same directory the api writes, so it mounts the same volume.
  retention:
    <<: *api
    profiles: ["app"]
    command: ["python", "-m", "abb_api.retention", "run"]
    volumes:
      - artifacts:/data/artifacts
    environment:
      ABB_ENVIRONMENT: development
      ABB_ARTIFACT_DIR: /data/artifacts
      ABB_RETENTION_DATABASE_URL: postgresql+asyncpg://abb_retention:${ABB_RETENTION_DB_PASSWORD:-abb_retention_dev_password}@postgres:5432/abb
      ABB_RETENTION_MODE: ${ABB_RETENTION_MODE:-dry_run}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Backup and restore (ADR-162), run on demand: docker compose --profile ops run --rm backup create --out /backups/<name>
  # Connects as the database OWNER (it must read every table, including server_secrets): never give this service to
  # anything that is reachable. Bundles hold server_secrets and are as sensitive as the database: encrypt them
  # (--encrypt --passphrase-env/--passphrase-file) and keep ./backups private. Restore needs an EMPTY database and
  # artifact directory, passed per run (ABB_RESTORE_DATABASE_URL, --artifact-dir); see docs/runbooks/backup-restore.md.
  backup:
    <<: *api
    profiles: ["ops"]
    entrypoint: ["python", "-m", "abb_api.backup"]
    volumes:
      - artifacts:/data/artifacts
      - ${ABB_BACKUP_DIR:-./backups}:/backups
    environment:
      ABB_ENVIRONMENT: development
      ABB_ARTIFACT_DIR: /data/artifacts
      ABB_BACKUP_DATABASE_URL: postgresql+asyncpg://abb:${ABB_POSTGRES_PASSWORD:-abb_dev_password}@postgres:5432/abb
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      # Server-side only. The web server holds no credential: it forwards the visitor's session cookie (ADR-060).
      ABB_API_INTERNAL_URL: http://api:8000
      ABB_WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local dashboards (Phase 19c, docs/OPERATIONS.md "Local dashboards"): `make observability-up`. Both bind to
  # loopback only. The metrics token is read from a file (`make observability-token` creates .local/metrics-token,
  # mode 0600, which is never committed); the stack never has the token in a config file or an argument. Tags are
  # pinned to a version; digest pinning is done with the other images (Phase 19c step 7).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    # Runs as the invoking user so it can read the 0600 token file (make sets these from `id`). The time series
    # live in memory (tmpfs) and are gone on `down`: this is a local view, not a monitoring system of record.
    user: "${ABB_OBS_UID:-65534}:${ABB_OBS_GID:-65534}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=:9090
    # mode=1777: a recent Docker mounts a tmpfs 0775 root:root, which the non-root user above cannot write (Prometheus then
    # panics on /prometheus/queries.active). Found by scripts/obs-e2e.sh, the first thing to run this profile for real.
    tmpfs:
      - /prometheus:mode=1777
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./.local/metrics-token:/etc/prometheus/abb-metrics-token:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      # A development default for a loopback-only port. Set ABB_GRAFANA_ADMIN_PASSWORD for anything else.
      GF_SECURITY_ADMIN_PASSWORD: ${ABB_GRAFANA_ADMIN_PASSWORD:-abb_grafana_dev_password}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
  grafana-data:
