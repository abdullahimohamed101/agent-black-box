[project]
name = "agent-black-box-langgraph"
version = "0.1.0"
description = "Agent Black Box adapter for LangGraph / LangChain callbacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["agent-black-box>=0.1.0"]

[project.optional-dependencies]
# The framework is optional (ADR-050): the handler works against any object that calls the
# callback methods; with langchain-core installed it also subclasses BaseCallbackHandler.
langgraph = ["langgraph>=0.2"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "agent-black-box",
  "abb-event-schema",
  "abb-conformance",
  "langgraph>=0.2",
]

[tool.uv.sources]
agent-black-box = { path = "../../packages/sdk-python", editable = true }
abb-event-schema = { path = "../../packages/event-schema", editable = true }
abb-conformance = { path = "../conformance", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbox_langgraph"]
