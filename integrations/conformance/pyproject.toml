[project]
name = "abb-conformance"
version = "0.1.0"
description = "Shared conformance suite for Agent Black Box framework adapters (spec 70); test support, not published"
requires-python = ">=3.10"
dependencies = ["agent-black-box", "abb-event-schema"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[tool.uv.sources]
agent-black-box = { path = "../../packages/sdk-python", editable = true }
abb-event-schema = { path = "../../packages/event-schema", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abb_conformance"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["abb_conformance"]
branch = true

[tool.coverage.report]
fail_under = 85
