[project]
name = "abb-api"
version = "0.0.0"
description = "Agent Black Box API (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "abb-event-schema",
]

[tool.uv.sources]
abb-event-schema = { path = "../../packages/event-schema", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abb_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["abb_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/versions/*" = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
