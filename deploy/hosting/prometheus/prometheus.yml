# Prometheus for a hosted Agent BlackBox (Phase 23, ADR-178), used by deploy/hosting/compose.observability.yml.
# Scrapes the API and worker over the private compose network (the metrics port is never published; Caddy answers 404 for /metrics),
# the host (node_exporter, including the backup and container textfiles), Alertmanager, blackbox_exporter and the public HTTPS name.
# The metrics token is read from a FILE (secrets/metrics_token, mode 0600, the same value as ABB_METRICS_TOKEN): it is never in this file.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    deployment: hosted

rule_files:
  - /etc/prometheus/rules/*.yml                 # the application rules, deploy/observability/prometheus/rules
  - /etc/prometheus/hosting-rules/host.yml      # host, container, backup and certificate rules

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: abb-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/abb-metrics-token
    static_configs:
      - targets: ["api:8000"]

  # The worker serves metrics when ABB_WORKER_METRICS_PORT is set (deploy/hosting/compose.observability.yml sets it, bound to the
  # private network only).
  - job_name: abb-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/abb-metrics-token
    static_configs:
      - targets: ["worker:9101"]

  # Host metrics plus the textfile collector: abb_backup.prom, abb_restore_drill.prom, abb_containers.prom.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # The public name, as a visitor sees it: DNS, certificate chain and expiry, a 200 from /healthz. The target comes from
  # ABB_PUBLIC_ORIGIN (obs-init writes /etc/obs-config/prometheus/abb-https.yml), so no domain is hard-coded here.
  - job_name: abb-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/etc/obs-config/prometheus/abb-https.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
