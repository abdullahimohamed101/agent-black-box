# Production overlay (Phase 23, ADR-178). Merge it over the development file:
#   docker compose -f docker-compose.yml -f deploy/hosting/compose.production.yml --profile app up -d --build --wait
# Needs Docker Compose 2.24 or newer (`!reset` and `!override`). Every secret comes from the .env next to docker-compose.yml
# (template: .env.production.example); a missing one stops the command instead of falling back to a development default.
#
# What it changes, and why:
#   * no service publishes a port to the host: the only listener is the shared Caddy (deploy/hosting/edge) on the Docker
#     network `edge`. Docker publishes around the host firewall, so "no ports:" is the control, not ufw alone (ADR-178).
#   * ABB_ENVIRONMENT=production everywhere (switches off http issuers, dev sessions, the seeded owner and /docs).
#   * ABB_TRUST_PROXY=1 on api and web: valid only because Caddy is the sole path in and replaces X-Forwarded-For.
#   * fake-oidc moves to a profile nobody starts.
#   * restart policy, log rotation and memory ceilings. mem_limit is a ceiling, not a reservation: the values below come from
#     scripts/hosting-e2e.sh (docker stats peaks under its smoke load) with headroom for growth, and sum to about 2.4 GiB with
#     the Caddy's 128m, while the same containers idle near 0.5 GiB. Docker kills a container that crosses its ceiling.
name: agent-black-box

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Names of the attachment on the shared edge network. `abb-api` and `abb-web` are aliases so that a second app on the same
# network (its own `api` or `web`) cannot be resolved by mistake: the Caddyfile only ever names these two.
x-edge-api: &edge-api
  default: {}
  edge:
    aliases: [abb-api]
x-edge-web: &edge-web
  default: {}
  edge:
    aliases: [abb-web]

x-prod-env: &prod-env
  ABB_ENVIRONMENT: production
  ABB_CORS_ORIGINS: ${ABB_PUBLIC_ORIGIN:?set ABB_PUBLIC_ORIGIN to the public https origin}
  ABB_RATE_LIMIT_EVENTS_PER_SECOND: ${ABB_RATE_LIMIT_EVENTS_PER_SECOND:-2000}
  ABB_RATE_LIMIT_BURST_EVENTS: ${ABB_RATE_LIMIT_BURST_EVENTS:-10000}

networks:
  edge:
    external: true
    name: ${ABB_EDGE_NETWORK:-edge}

services:
  postgres:
    # PostgreSQL 17, not the development file's 16: the API image's backup client is 17.x and its pg_restore sends
    # `SET transaction_timeout`, which a 16 server rejects, so a bundle taken in the image could not be restored into 16
    # (found by scripts/hosting-backup-e2e.sh; docs/KNOWN_ISSUES.md). A fresh hosted volume has no 16 data to carry over.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${ABB_POSTGRES_PASSWORD:?generate with scripts/hosting-secrets.sh}
    restart: unless-stopped
    # Measured peak 58 MiB with 2,000 events; the ceiling leaves room for shared_buffers (128 MB) to fill, autovacuum and
    # larger working sets as the data grows. Resize before it is the reason for an OOM kill (docs/hosting-guide.md).
    mem_limit: 512m
    logging: *logging

  migrate:
    environment:
      <<: *prod-env
      ABB_DATABASE_URL: postgresql+asyncpg://abb:${ABB_POSTGRES_PASSWORD:?set ABB_POSTGRES_PASSWORD}@postgres:5432/abb
      ABB_RUNTIME_DB_PASSWORD: ${ABB_RUNTIME_DB_PASSWORD:?set ABB_RUNTIME_DB_PASSWORD}
      ABB_RETENTION_DB_PASSWORD: ${ABB_RETENTION_DB_PASSWORD:?set ABB_RETENTION_DB_PASSWORD}
    mem_limit: 512m
    logging: *logging

  api:
    ports: !reset []
    networks: *edge-api
    environment:
      <<: *prod-env
      ABB_DATABASE_URL: postgresql+asyncpg://abb_runtime:${ABB_RUNTIME_DB_PASSWORD:?set ABB_RUNTIME_DB_PASSWORD}@postgres:5432/abb
      ABB_WEB_ORIGIN: ${ABB_PUBLIC_ORIGIN:?set ABB_PUBLIC_ORIGIN}
      ABB_TRUST_PROXY: "1"
      ABB_OIDC_ISSUER: ${ABB_OIDC_ISSUER:-https://accounts.google.com}
      ABB_OIDC_CLIENT_ID: ${ABB_OIDC_CLIENT_ID:?set ABB_OIDC_CLIENT_ID}
      ABB_OIDC_CLIENT_SECRET: ${ABB_OIDC_CLIENT_SECRET:?set ABB_OIDC_CLIENT_SECRET}
      # Google serves its token and keys endpoints from other hosts than its issuer; the client refuses them unless listed.
      ABB_OIDC_EXTRA_HOSTS: ${ABB_OIDC_EXTRA_HOSTS:-oauth2.googleapis.com,www.googleapis.com}
      ABB_ALLOW_DEV_SESSIONS: "0"
    restart: unless-stopped
    # Measured peak 163 MiB under the rig's smoke load. The ceiling covers the worst measured case of the body-bytes budget
    # (ABB_MAX_BODY_BYTES_IN_FLIGHT 64 MiB x about 6.5, docs/OPERATIONS.md) on top of that baseline.
    mem_limit: 768m
    logging: *logging

  # Never started: a development-only provider that accepts any email. The profile name is deliberately not one anyone uses.
  fake-oidc:
    profiles: !override ["dev-only-never-start"]

  worker:
    environment:
      <<: *prod-env
      ABB_DATABASE_URL: postgresql+asyncpg://abb_runtime:${ABB_RUNTIME_DB_PASSWORD:?set ABB_RUNTIME_DB_PASSWORD}@postgres:5432/abb
    # Measured peak 86 MiB while it summarised 2,000 events and analysed 23 runs.
    mem_limit: 384m
    logging: *logging

  retention:
    environment:
      ABB_ENVIRONMENT: production
      ABB_RETENTION_DATABASE_URL: postgresql+asyncpg://abb_retention:${ABB_RETENTION_DB_PASSWORD:?set ABB_RETENTION_DB_PASSWORD}@postgres:5432/abb
      # dry_run until a restore drill has been performed (docs/runbooks/retention.md); enforce deletes permanently.
      ABB_RETENTION_MODE: ${ABB_RETENTION_MODE:-dry_run}
    # Measured peak 68 MiB in dry_run. Revisit before enabling enforce (it reads and deletes in bounded batches).
    mem_limit: 256m
    logging: *logging

  backup:
    environment:
      ABB_ENVIRONMENT: production
      ABB_BACKUP_DATABASE_URL: postgresql+asyncpg://abb:${ABB_POSTGRES_PASSWORD:?set ABB_POSTGRES_PASSWORD}@postgres:5432/abb
    logging: *logging

  web:
    # An explicit image name, like the API's (docker-compose.yml): hosting-upgrade.sh tags and restores only services that have
    # both `build` and `image`, so without it a rollback would restart the NEW dashboard on the old API (review P1-1).
    # ABB_WEB_IMAGE exists for the upgrade rig, which must not move a developer's tag.
    image: ${ABB_WEB_IMAGE:-agent-black-box-web:local}
    ports: !reset []
    networks: *edge-web
    build:
      args:
        NEXT_PUBLIC_API_URL: ${ABB_PUBLIC_ORIGIN:?set ABB_PUBLIC_ORIGIN}
    environment:
      ABB_WEB_ORIGIN: ${ABB_PUBLIC_ORIGIN:?set ABB_PUBLIC_ORIGIN}
      ABB_TRUST_PROXY: "1"
    restart: unless-stopped
    # Measured peak 59 MiB after rendering the main pages five times; server-rendered pages grow with use.
    mem_limit: 384m
    logging: *logging

  # Optional dashboards (profile `observability`): the base file already binds them to loopback; they are reached only through
  # an SSH tunnel. Restated so a future edit of the base file cannot publish them. The hosting dashboards, retention and the
  # Grafana password come with the hosting observability overlay. A required-variable check cannot live here: Compose
  # interpolates every service, active or not, so it would block the app stack for a variable only the dashboards use.
  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
  grafana:
    ports: !override
      - "127.0.0.1:3001:3000"
