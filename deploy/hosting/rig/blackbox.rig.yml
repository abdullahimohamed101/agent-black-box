# Rig only (scripts/hosting-obs-e2e.sh): the same https_2xx module, but trusting the rig Caddy's throwaway local CA certificate.
# Production uses deploy/hosting/blackbox/blackbox.yml, which verifies against the system roots.
modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
