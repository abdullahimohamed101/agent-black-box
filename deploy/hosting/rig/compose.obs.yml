# Test overlay for scripts/hosting-obs-e2e.sh (Phase 23, step 9); never exists on a real server. Merged over docker-compose.yml,
# deploy/hosting/compose.production.yml and deploy/hosting/compose.observability.yml:
#   * the API/worker images carry the rig's own tag (a developer's agent-black-box-api:local tag is never moved or removed);
#   * the monitoring UIs bind rig-only loopback ports; the textfile directory is the rig's;
#   * blackbox joins the rig's edge network and trusts the rig Caddy's throwaway certificate (rig/blackbox.rig.yml);
#   * node_exporter mounts the root without `rslave` (the Docker VM of a laptop does not always allow it).
services:
  migrate: { image: abb-hosting-obs-api:local }
  worker: { image: abb-hosting-obs-api:local }
  retention: { image: abb-hosting-obs-api:local }
  backup: { image: abb-hosting-obs-api:local }
  api: { image: abb-hosting-obs-api:local }
  prometheus:
    ports: !override
      - "127.0.0.1:${ABB_OBS_RIG_PROM_PORT:?}:9090"
  alertmanager:
    ports: !override
      - "127.0.0.1:${ABB_OBS_RIG_AM_PORT:?}:9093"
  grafana:
    ports: !override
      - "127.0.0.1:${ABB_OBS_RIG_GRAFANA_PORT:?}:3000"
  node-exporter:
    volumes: !override
      - /:/host:ro
      - ${ABB_TEXTFILE_DIR:?}:/textfile:ro
  blackbox:
    networks:
      default: {}
      edge: {}
    volumes: !override
      - ./deploy/hosting/rig/blackbox.rig.yml:/etc/blackbox/blackbox.yml:ro
